name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      - name: Doc check
        run: .bin/doc-check
