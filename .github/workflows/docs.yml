name: Deploy DocC to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docc-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      BUILDING_DOCC: 1
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Resolve packages
        run: swift package resolve

      - name: Generate DocC
        run: |
          swift package \
            --allow-writing-to-directory ./docs \
            generate-documentation \
            --target LoomCore \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path loom-core \
            --warnings-as-errors \
            --output-path ./docs

      - name: Write root redirect
        run: |
          cat > ./docs/index.html <<'EOF'
          <!DOCTYPE html>
          <meta http-equiv="refresh" content="0; url=./documentation/loomcore/">
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
